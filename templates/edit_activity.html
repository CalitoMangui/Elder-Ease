<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Elder-Ease | Edit Activity</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        html,
        body {
            background-color: #0b1f3a !important;
            color: white !important;
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
        }

        .edit-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 50px 25px;
        }

        .edit-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .edit-header h1 {
            color: white;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .edit-header p {
            color: white;
            font-size: 18px;
        }

        .edit-form {
            background-color: #12345a;
            padding: 35px;
            border-radius: 15px;
        }

        .edit-form label {
            display: block;
            color: white;
            font-size: 17px;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        .edit-form input,
        .edit-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        .edit-form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .update-button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: white;
            color: #0b1f3a;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 24px;
            background-color: white;
            color: #0b1f3a;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <nav>

        <div class="logo">
            Elder-Ease
        </div>

        <div class="navigation">

            <a href="/">
                🏠 Home
            </a>

            <a href="/shelter-dashboard">
                📊 Dashboard
            </a>

            <a href="/my-activities">
                📅 My Activities
            </a>

        </div>

    </nav>


    <main>

        <div class="edit-container">

            <div class="edit-header">

                <h1>
                    ✏️ Edit Activity
                </h1>

                <p>
                    Update the details of your activity.
                </p>

            </div>


            <form action="/edit-activity/{{ activity['id'] }}"
                  method="POST"
                  class="edit-form">


                <label for="activity_name">
                    Activity Name
                </label>

                <input
                    type="text"
                    id="activity_name"
                    name="activity_name"
                    value="{{ activity['name'] }}"
                    required
                >


                <label for="activity_date">
                    Date
                </label>

                <input
                    type="date"
                    id="activity_date"
                    name="activity_date"
                    value="{{ activity['date'] }}"
                    required
                >


                <label for="activity_time">
                    Time
                </label>

                <input
                    type="time"
                    id="activity_time"
                    name="activity_time"
                    value="{{ activity['time'] }}"
                    required
                >


                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ activity['location'] }}"
                    required
                >


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    required
                >{{ activity['description'] }}</textarea>


                <label for="participants">
                    Number of Participants
                </label>

                <input
                    type="number"
                    id="participants"
                    name="participants"
                    value="{{ activity['participants'] }}"
                    min="1"
                    required
                >


                <button type="submit"
                        class="update-button">

                    💾 Update Activity

                </button>

            </form>


            <a href="/my-activities"
               class="back-button">

                ← Back to My Activities

            </a>

        </div>

    </main>

</body>

</html>
