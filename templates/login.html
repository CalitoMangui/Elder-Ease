<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Elder-Ease - Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #071a3d;
    color: white;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 40px 20px;
}

.card {
    background: white;
    color: #071a3d;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
}

.icon {
    text-align: center;
    font-size: 65px;
    margin-bottom: 10px;
}

h1 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    font-size: 20px;
    margin-bottom: 30px;
}

label {
    display: block;
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 16px;
    font-size: 19px;
    border: 2px solid #071a3d;
    border-radius: 12px;
}

input:focus {
    outline: none;
    border: 3px solid #071a3d;
}

.login-button {
    width: 100%;
    margin-top: 30px;
    padding: 18px;
    background: #071a3d;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:hover {
    opacity: 0.9;
}

.register-link {
    display: block;
    text-align: center;
    margin-top: 25px;
    font-size: 19px;
    color: #071a3d;
    font-weight: bold;
    text-decoration: none;
}

.message {
    background: #eef3ff;
    color: #071a3d;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    margin-bottom: 20px;
}

.back-button {
    display: block;
    text-align: center;
    margin-top: 20px;
    padding: 14px;
    background: #071a3d;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-size: 18px;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">👋🏽</div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your Elder-Ease account.
        </p>

        {% if message %}

        <div class="message">
            {{ message }}
        </div>

        {% endif %}

        <form action="/login" method="POST">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="submit"
                class="login-button">
                🔐 Login
            </button>

        </form>

        <a href="/register" class="register-link">
            Don't have an account? Create one
        </a>

        <a href="/" class="back-button">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
