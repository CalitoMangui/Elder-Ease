<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Elder-Ease | Edit Post</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1f3a;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: auto;
            padding: 40px 0;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .edit-card {
            background-color: #12345a;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        label {
            display: block;
            font-size: 20px;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            box-sizing: border-box;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 18px;
            font-family: Arial, sans-serif;
            resize: vertical;
        }

        textarea:focus {
            outline: 3px solid white;
        }

        .button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 20px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background-color: white;
            color: #0b1f3a;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background-color: #dce8f5;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            color: white;
            font-size: 18px;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>📝 Edit Your Post</h1>

    <p class="intro">
        Make changes to your community post.
    </p>


    <div class="edit-card">

        <form action="/edit-post/{{ post['id'] }}"
              method="POST">

            <label for="content">
                Your post:
            </label>

            <textarea
                id="content"
                name="content"
                required>{{ post["content"] }}</textarea>

            <button type="submit"
                    class="button">

                💾 Save Changes

            </button>

        </form>

    </div>


    <a href="/community"
       class="back-button">

        ← Back to Community

    </a>

</div>

</body>

</html>
