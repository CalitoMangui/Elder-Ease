<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Elder-Ease | Edit Shelter Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        html,
        body {
            background-color: #0b1f3a !important;
            color: white !important;
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
        }

        .edit-profile-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 50px 25px;
        }

        .edit-profile-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .edit-profile-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .edit-profile-header h1 {
            color: white;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .edit-profile-header p {
            color: white;
            font-size: 18px;
        }

        .edit-profile-form {
            background-color: #12345a;
            padding: 35px;
            border-radius: 18px;
        }

        .edit-profile-form label {
            display: block;
            color: white;
            font-size: 17px;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        .edit-profile-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        .save-profile-button {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: white;
            color: #0b1f3a;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 24px;
            background-color: white;
            color: #0b1f3a;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 17px;
        }

        .page-footer {
            text-align: center;
        }

    </style>

</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <div class="logo">
            Elder-Ease
        </div>

        <div class="navigation">

            <a href="/">
                🏠 Home
            </a>

            <a href="/shelter-dashboard">
                📊 Dashboard
            </a>

            <a href="/shelter-profile">
                🏠 Shelter Profile
            </a>

        </div>

    </nav>


    <!-- EDIT PROFILE -->

    <main>

        <div class="edit-profile-container">


            <div class="edit-profile-header">

                <div class="edit-profile-icon">
                    ✏️
                </div>

                <h1>
                    Edit Shelter Profile
                </h1>

                <p>
                    Update your shelter information
                </p>

            </div>


            <form action="/edit-shelter-profile"
                  method="POST"
                  class="edit-profile-form">


                <label for="shelter_name">
                    🏠 Shelter Name
                </label>

                <input
                    type="text"
                    id="shelter_name"
                    name="shelter_name"
                    value="{{ shelter['shelter_name'] }}"
                    required
                >


                <label for="email">
                    📧 Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ shelter['email'] }}"
                    required
                >


                <label for="phone">
                    📞 Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    value="{{ shelter['phone'] }}"
                    required
                >


                <label for="address">
                    📍 Address
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    value="{{ shelter['address'] }}"
                    required
                >


                <button type="submit"
                        class="save-profile-button">

                    💾 Save Changes

                </button>

            </form>


            <div class="page-footer">

                <a href="/shelter-profile"
                   class="back-button">

                    ← Back to Profile

                </a>

            </div>


        </div>

    </main>


</body>

</html>
