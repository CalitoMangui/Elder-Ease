<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Elder-Ease | Shelter Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        html,
        body {
            background-color: #0b1f3a !important;
            color: white !important;
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
        }

        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 50px 25px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .profile-header h1 {
            color: white;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .profile-header p {
            color: white;
            font-size: 18px;
        }

        .profile-card {
            background-color: #12345a;
            padding: 35px;
            border-radius: 18px;
        }

        .profile-item {
            margin-bottom: 25px;
        }

        .profile-item h3 {
            color: white;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .profile-item p {
            color: white;
            font-size: 18px;
            margin: 0;
        }

        .profile-button {
            display: inline-block;
            margin-top: 15px;
            padding: 15px 25px;
            background-color: white;
            color: #0b1f3a;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 17px;
        }

        .profile-footer {
            text-align: center;
            margin-top: 30px;
        }

    </style>

</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <div class="logo">
            Elder-Ease
        </div>

        <div class="navigation">

            <a href="/">
                🏠 Home
            </a>

            <a href="/shelter-dashboard">
                📊 Dashboard
            </a>

            <a href="/my-activities">
                📅 My Activities
            </a>

        </div>

    </nav>


    <!-- PROFILE -->

    <main>

        <div class="profile-container">


            <div class="profile-header">

                <div class="profile-icon">
                    🏠
                </div>

                <h1>
                    Shelter Profile
                </h1>

                <p>
                    View your shelter information
                </p>

            </div>


            <div class="profile-card">


                <div class="profile-item">

                    <h3>
                        🏠 Shelter Name
                    </h3>

                    <p>
                        {{ shelter["shelter_name"] }}
                    </p>

                </div>


                <div class="profile-item">

                    <h3>
                        📧 Email
                    </h3>

                    <p>
                        {{ shelter["email"] }}
                    </p>

                </div>


                <div class="profile-item">

                    <h3>
                        📞 Phone
                    </h3>

                    <p>
                        {{ shelter["phone"] }}
                    </p>

                </div>


                <div class="profile-item">

                    <h3>
                        📍 Address
                    </h3>

                    <p>
                        {{ shelter["address"] }}
                    </p>

                </div>


            </div>


            <div class="profile-footer">

    <a href="/edit-shelter-profile"
       class="profile-button">

        ✏️ Edit Profile

    </a>

    <a href="/shelter-dashboard"
       class="profile-button">

        ← Back to Dashboard

    </a>

</div>


        </div>

    </main>


</body>

</html>
