<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Elder-Ease | Comment</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1f3a;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: auto;
            padding: 40px 0;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .comment-card {
            background-color: #12345a;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .original-post {
            background-color: #0b1f3a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .original-post strong {
            font-size: 20px;
        }

        label {
            display: block;
            font-size: 20px;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            box-sizing: border-box;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 18px;
            font-family: Arial, sans-serif;
            resize: vertical;
        }

        textarea:focus {
            outline: 3px solid white;
        }

        .button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 20px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background-color: white;
            color: #0b1f3a;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background-color: #dce8f5;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            color: white;
            font-size: 18px;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>💬 Comment</h1>

    <p class="intro">
        Join the conversation.
    </p>


    <div class="comment-card">

        <div class="original-post">

            <strong>
                {{ post["name"] }}
            </strong>

            <p>
                {{ post["content"] }}
            </p>

        </div>


        <form action="/comment/{{ post['id'] }}"
              method="POST">

            <label for="content">
                Write your comment:
            </label>

            <textarea
                id="content"
                name="content"
                placeholder="Write your comment here..."
                required></textarea>

            <button type="submit"
                    class="button">

                📤 Publish Comment

            </button>

        </form>

    </div>


    <a href="/community"
       class="back-button">

        ← Back to Community

    </a>

</div>

</body>

</html>
